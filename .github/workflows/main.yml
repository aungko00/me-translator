name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          mkdir -p "${SDK_ROOT}/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "${SDK_ROOT}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "${SDK_ROOT}/licenses/android-googletv-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a\n" > "${SDK_ROOT}/licenses/intel-android-extra-license"

          SDKMANAGER=""
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Prepare Optional Secret Keystore Override
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
          elif [ -f "signing/me-translator.keystore" ]; then
            echo "Using repository signing/me-translator.keystore for deterministic APK updates."
          else
            echo "::warning::No signing/me-translator.keystore or ANDROID_KEYSTORE_BASE64 found!"
          fi

      - name: Compute App Version Metadata
        id: meta
        run: |
          APP_VER=$(node -e "const fs=require('fs');const s=fs.readFileSync('lib/app-config.ts','utf8');console.log(s.match(/APP_VERSION\s*=\s*'([^']+)'/)[1])")
          VER_CODE=$(node -e "const fs=require('fs');const s=fs.readFileSync('lib/app-config.ts','utf8');const m=s.match(/ANDROID_VERSION_CODE\s*=\s*(\d+)/);console.log(m?m[1]:124)")
          TAG_NAME="v${APP_VER}"
          WHATS_NEW=$(node -e "const fs=require('fs');const s=fs.readFileSync('lib/app-config.ts','utf8').replace(/export const /g,'const ');const notes=Function(s + '; return typeof RELEASE_WHATS_NEW === \"string\" ? RELEASE_WHATS_NEW : \"\";')();process.stdout.write(notes);")
          TARGET_REPO="${{ vars.RELEASE_REPO || github.repository }}"
          RELEASE_CHECK=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${TARGET_REPO}/releases/tags/${TAG_NAME}")
          SHOULD_RELEASE="true"
          if [ "$RELEASE_CHECK" = "200" ]; then
            SHOULD_RELEASE="false"
            echo "Release ${TAG_NAME} already exists; skipping duplicate GitHub Release publish."
          fi
          echo "version=${APP_VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VER_CODE}" >> $GITHUB_OUTPUT
          echo "should_release=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT
          {
            echo 'changelog<<__CHANGELOG_EOF__'
            printf '%s\n' "${WHATS_NEW}"
            echo '__CHANGELOG_EOF__'
          } >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Static Web Bundle for Android
        run: |
          TARGET_REPO="${{ vars.RELEASE_REPO || github.repository }}"
          if [ -n "${TARGET_REPO}" ]; then
            node -e "const fs=require('fs');let s=fs.readFileSync('lib/app-config.ts','utf8');s=s.replace(/DEFAULT_GITHUB_REPO\s*=\s*'[^']*'/, \"DEFAULT_GITHUB_REPO = '${TARGET_REPO}'\");fs.writeFileSync('lib/app-config.ts',s,'utf8');"
          fi
          npm run build:capacitor

      - name: Initialize & Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Version, Native Updater, Signing, Permissions & Icons
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/setup-android-native.mjs "${{ steps.meta.outputs.version_code }}" "${{ steps.meta.outputs.version }}"

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          APK_FILE="ME-Translator-${{ steps.meta.outputs.tag }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${APK_FILE}"
          echo "=== APK Signing Certificate ==="
          keytool -printcert -jarfile "${APK_FILE}" | grep -E "Owner:|SHA256:" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ME-Translator-${{ steps.meta.outputs.tag }}-APK
          path: ME-Translator-${{ steps.meta.outputs.tag }}.apk

      - name: Publish GitHub Release with APK
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASE_REPO || github.repository }}
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "ME Translator ${{ steps.meta.outputs.tag }}"
          body: ${{ steps.meta.outputs.changelog }}
          files: ME-Translator-${{ steps.meta.outputs.tag }}.apk
          make_latest: true
